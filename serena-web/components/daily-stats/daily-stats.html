<!-- DAILY STATS COMPONENT -->
<section class="daily-stats-section">
  <h2 class="section-title">Statistik Harian</h2>

  <div class="stats-grid">
    <!-- Stat 1: Tugas tersisa -->
    <div class="stat-card">
      <div class="stat-icon-wrapper">
        <div class="icon-box-checklist">
          <div class="checklist-row">
            <span class="checklist-box"></span>
            <span class="checklist-line"></span>
          </div>
          <div class="checklist-row">
            <span class="checklist-box"></span>
            <span class="checklist-line"></span>
          </div>
          <div class="checklist-row">
            <span class="checklist-box"></span>
            <span class="checklist-line"></span>
          </div>
        </div>
      </div>
      <div class="stat-value" id="statRemainingTasks">3</div>
      <div class="stat-label">Tugas tersisa</div>
    </div>

    <!-- Stat 2: Waktu fokus -->
    <div class="stat-card">
      <div class="stat-icon-wrapper">
        <svg class="icon-box-hourglass" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Glass Capsule -->
          <rect x="12" y="5" width="20" height="34" rx="10" fill="#EAF1FE" stroke="#6FA8F5" stroke-width="2.8"/>
          <!-- Sand base -->
          <path d="M15 29C15 29 18 36 22 36C26 36 29 29 29 29Z" fill="url(#statGrad2)"/>
          <!-- Top rim & bottom rim -->
          <rect x="9" y="3" width="26" height="4" rx="2" fill="url(#statGrad2)"/>
          <rect x="9" y="37" width="26" height="4" rx="2" fill="url(#statGrad2)"/>
          <defs>
            <linearGradient id="statGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#6FA8F5"/>
              <stop offset="100%" stop-color="#A66BF0"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <div class="stat-value" id="statFocusTime">1j 40m</div>
      <div class="stat-label">Waktu fokus</div>
    </div>

    <!-- Stat 3: Selesai -->
    <div class="stat-card">
      <div class="stat-icon-wrapper">
        <div class="icon-box-completed">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
      </div>
      <div class="stat-value" id="statCompletedTasks">2</div>
      <div class="stat-label">Selesai</div>
    </div>
  </div>
</section>
