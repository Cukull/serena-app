<!-- APP HEADER COMPONENT -->
<header class="app-header">
  <div class="brand-section">
    <!-- Serena Official Logo -->
    <div class="logo-icon-box" title="Serena Brand">
      <img src="../../assets/icons/serena-logo.png" alt="Serena Icon" class="brand-logo-img">
    </div>

    <!-- Serena Official Wordmark -->
    <div class="brand-title-wrap">
      <img src="../../assets/icons/serena-wordmark.png" alt="SERENA" class="brand-wordmark-img">
    </div>
  </div>

  <div class="header-actions">
    <!-- Notification Bell Button -->
    <button class="btn-icon-round" id="notificationBtn" aria-label="Notifikasi" title="Notifikasi baru">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B2340" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
      <span class="notification-badge-dot"></span>
    </button>

    <!-- User Profile Avatar -->
    <div class="avatar-badge clickable-card" id="headerUserAvatar" title="Profil Yusup Arief" style="cursor: pointer;">
      YA
    </div>
  </div>
</header>
