<!-- DETAIL JADWAL KULIAH COMPONENT -->
<div class="detail-jadwal-container" id="detailJadwalCard">
  <!-- Header -->
  <div class="detail-jadwal-header">
    <span class="jadwal-type-badge">KULIAH</span>
    <span class="jadwal-today-badge">Hari ini</span>
  </div>

  <!-- Title -->
  <h2 class="jadwal-main-title">Kuliah UI/UX Design</h2>

  <!-- Badges -->
  <div class="jadwal-badge-row">
    <span class="tag-pill tag-pill-blue">Design</span>
    <span class="tag-pill tag-pill-purple">Sem. 6</span>
  </div>

  <!-- Time Hero Box -->
  <div class="jadwal-time-hero">
    <div class="jadwal-time-info">
      <span class="jadwal-time-label">Jadwal kuliah</span>
      <span class="jadwal-time-value">09:00 – 11:00</span>
      <span class="jadwal-time-duration">Durasi 2 jam</span>
    </div>
    <div class="jadwal-time-icon-box">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12 6 12 12 16 14"></polyline>
      </svg>
    </div>
  </div>

  <!-- Info Grid: Ruang & Dosen -->
  <div class="jadwal-info-grid">
    <div class="jadwal-info-tile">
      <div class="jadwal-tile-icon-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
          <circle cx="12" cy="10" r="3"></circle>
        </svg>
      </div>
      <div class="jadwal-tile-text">
        <span class="jadwal-tile-label">Ruang</span>
        <span class="jadwal-tile-value">Room E12</span>
      </div>
    </div>

    <div class="jadwal-info-tile">
      <div class="jadwal-tile-icon-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </div>
      <div class="jadwal-tile-text">
        <span class="jadwal-tile-label">Dosen</span>
        <span class="jadwal-tile-value">Dr. Ir. Hendra</span>
      </div>
    </div>
  </div>

  <!-- Reminder -->
  <div class="jadwal-reminder-card">
    <div class="jadwal-reminder-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
    </div>
    <div class="jadwal-reminder-text">
      <span class="jadwal-reminder-label">Pengingat</span>
      <span class="jadwal-reminder-value">30 menit sebelum kuliah</span>
    </div>
  </div>

  <!-- Section: Tugas Hari Ini -->
  <div class="jadwal-section-label">Tugas hari ini</div>

  <div class="jadwal-linked-task" id="linkedTugasItem" title="Klik untuk lihat detail tugas">
    <div class="jadwal-linked-task-info">
      <span class="jadwal-linked-task-tag">TUGAS · 23.59</span>
      <span class="jadwal-linked-task-title">Kumpulkan Tugas Web Development</span>
    </div>
    <span class="badge-urgent">Segera</span>
  </div>

  <!-- Action -->
  <button class="btn-jadwal-kembali" id="btnJadwalKembali">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
    <span>Kembali</span>
  </button>
</div>
