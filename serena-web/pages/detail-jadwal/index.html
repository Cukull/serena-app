<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Serena — Detail Jadwal Kuliah</title>
  <link rel="stylesheet" href="../home/home.css">
  <link rel="stylesheet" href="../../components/detail-jadwal/detail-jadwal.css">
</head>
<body>
  <div class="device-wrapper">
    <div class="serena-app-frame">
      <!-- Ambient Glow Orbs -->
      <div class="ambient-glow-container">
        <div class="glow-orb orb-blue-top"></div>
        <div class="glow-orb orb-green-top"></div>
        <div class="glow-orb orb-purple-bottom"></div>
      </div>

      <!-- Status Bar -->
      <div class="status-bar">
        <div class="status-bar-time" id="statusClock">9:41</div>
        <div class="status-bar-icons">
          <div class="cellular-signal"><div class="bar bar-1"></div><div class="bar bar-2"></div><div class="bar bar-3"></div><div class="bar bar-4"></div></div>
          <div class="battery-icon"><div class="battery-body"><div class="battery-level"></div></div><div class="battery-cap"></div></div>
        </div>
      </div>

      <main class="app-content-scroll" style="padding-top: 10px;">
        <div class="detail-jadwal-container">
          <div class="detail-jadwal-header">
            <span class="jadwal-type-badge">KULIAH</span>
            <span class="jadwal-today-badge">Hari ini</span>
          </div>

          <h2 class="jadwal-main-title">Kuliah UI/UX Design</h2>

          <div class="jadwal-badge-row">
            <span class="tag-pill tag-pill-blue">Design</span>
            <span class="tag-pill tag-pill-purple">Sem. 6</span>
          </div>

          <div class="jadwal-time-hero">
            <div class="jadwal-time-info">
              <span class="jadwal-time-label">Jadwal kuliah</span>
              <span class="jadwal-time-value">09:00 – 11:00</span>
              <span class="jadwal-time-duration">Durasi 2 jam</span>
            </div>
            <div class="jadwal-time-icon-box">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
              </svg>
            </div>
          </div>

          <div class="jadwal-info-grid">
            <div class="jadwal-info-tile">
              <div class="jadwal-tile-icon-box">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                  <circle cx="12" cy="10" r="3"></circle>
                </svg>
              </div>
              <div class="jadwal-tile-text">
                <span class="jadwal-tile-label">Ruang</span>
                <span class="jadwal-tile-value">Room E12</span>
              </div>
            </div>

            <div class="jadwal-info-tile">
              <div class="jadwal-tile-icon-box">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
              </div>
              <div class="jadwal-tile-text">
                <span class="jadwal-tile-label">Dosen</span>
                <span class="jadwal-tile-value">Dr. Ir. Hendra</span>
              </div>
            </div>
          </div>

          <div class="jadwal-reminder-card">
            <div class="jadwal-reminder-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
              </svg>
            </div>
            <div class="jadwal-reminder-text">
              <span class="jadwal-reminder-label">Pengingat</span>
              <span class="jadwal-reminder-value">30 menit sebelum kuliah</span>
            </div>
          </div>

          <div class="jadwal-section-label">Tugas hari ini</div>

          <a href="../detail-tugas/index.html" class="jadwal-linked-task" title="Klik untuk lihat detail tugas">
            <div class="jadwal-linked-task-info">
              <span class="jadwal-linked-task-tag">TUGAS · 23.59</span>
              <span class="jadwal-linked-task-title">Kumpulkan Tugas Web Development</span>
            </div>
            <span class="badge-urgent">Segera</span>
          </a>

          <a href="../home/index.html" class="btn-jadwal-kembali" id="btnJadwalKembali" title="Kembali ke halaman sebelumnya">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            <span>Kembali</span>
          </a>
        </div>
      </main>

      <div class="home-indicator"></div>
    </div>
  </div>

  <script src="../../assets/js/app.js"></script>
</body>
</html>
