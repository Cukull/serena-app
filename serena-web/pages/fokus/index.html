<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Serena — Fokus</title>
  <link rel="stylesheet" href="../home/home.css">
</head>
<body>
  <div class="device-wrapper">
    <div class="serena-app-frame">
      <div class="ambient-glow-container">
        <div class="glow-orb orb-purple-left"></div>
        <div class="glow-orb orb-green-mid"></div>
      </div>

      <div class="status-bar">
        <div class="status-bar-time">9:41</div>
        <div class="status-bar-icons">
          <div class="cellular-signal"><div class="bar bar-1"></div><div class="bar bar-2"></div><div class="bar bar-3"></div><div class="bar bar-4"></div></div>
          <div class="battery-icon"><div class="battery-body"><div class="battery-level"></div></div><div class="battery-cap"></div></div>
        </div>
      </div>

      <main class="app-content-scroll" style="display: flex; flex-direction: column; gap: 20px;">
        <div class="user-greeting">
          <h1 class="greeting-title">Sesi Fokus 🎯</h1>
          <p class="greeting-subtitle">Pilih teknik fokus untuk memaksimalkan belajarmu.</p>
        </div>

        <div class="focus-hero-card">
          <div class="hero-top-info">
            <div class="focus-status-badge">
              <span class="pulsing-dot"></span>
              <span class="focus-status-text">Pomodoro 25/5</span>
            </div>
            <div class="focus-timer-digits">25:00</div>
          </div>
          <button class="btn-pause-focus">
            <div class="btn-pause-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"><polygon points="5 3 19 12 5 21 5 3" fill="#ffffff"></polygon></svg>
            </div>
            <span class="btn-pause-label">Mulai Sesi</span>
          </button>
        </div>
      </main>

      <!-- Bottom Nav -->
      <nav class="bottom-nav-dock-container">
        <div class="bottom-nav-dock">
          <a href="../home/index.html" class="nav-tab-item">
            <div class="nav-tab-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg></div>
            <span class="nav-tab-label">Beranda</span>
          </a>
          <a href="../jadwal/index.html" class="nav-tab-item">
            <div class="nav-tab-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg></div>
            <span class="nav-tab-label">Jadwal</span>
          </a>
          <a href="./index.html" class="nav-tab-item active">
            <div class="nav-tab-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg></div>
            <span class="nav-tab-label">Fokus</span>
          </a>
          <a href="../akun/index.html" class="nav-tab-item">
            <div class="nav-tab-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></div>
            <span class="nav-tab-label">Akun</span>
          </a>
